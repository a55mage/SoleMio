<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sole Mio — Meteo</title>
    <meta name="description" content="Previsioni meteo con scena animata in tempo reale e prossimi 5 giorni.">
    <meta name="theme-color" content="#070b18">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='10' fill='%23ffd54a'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <canvas id="scene" aria-label="Animazione del meteo attuale"></canvas>
    <div class="app">
        <header class="top">
            <div class="brand"><span class="logo"></span><b>Sole Mio</b></div>
            <div class="search-wrap">
                <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                <input id="search" type="search" placeholder="Cerca una città…" autocomplete="off" aria-label="Cerca una città">
                <button id="locate" title="Usa la mia posizione" aria-label="Usa la mia posizione">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><circle cx="12" cy="12" r="8" /><path d="M12 1v3M12 20v3M1 12h3M20 12h3" /></svg>
                </button>
                <ul id="suggest" role="listbox" hidden></ul>
            </div>
        </header>

        <main class="grid">
            <section class="left">
                <div class="stage">
                    <div class="hero">
                        <div class="place">
                            <h1 id="city">—</h1>
                            <p id="country"></p>
                        </div>
                        <div class="now">
                            <div class="temp"><span id="temp">--</span><sup>°C</sup></div>
                            <div class="desc" id="desc">—</div>
                            <div class="hilo" id="hiLo"></div>
                        </div>
                    </div>
                    <div class="stage-foot">
                        <span class="chip" id="modeChip">Adesso</span>
                        <button class="chip btn" id="backNow" hidden>↺ Torna ad adesso</button>
                        <span class="clock"><b id="clock">--:--</b><i id="date"></i></span>
                    </div>
                    <div id="error" class="error" hidden>Impossibile caricare i dati meteo. Riprova tra poco.</div>
                </div>

                <div class="stats">
                    <div class="stat"><span class="lbl" id="sFeelsLbl">Percepita</span><span class="val" id="sFeels">--</span><span class="sub">temperatura</span></div>
                    <div class="stat"><span class="lbl">Vento</span><span class="val"><span id="sWind">--</span><small>km/h</small></span>
                        <span class="sub"><svg id="windArrow" class="arrow" viewBox="0 0 24 24"><path d="M12 3v18M12 3l-6 7M12 3l6 7" /></svg><span id="sWindDir">--</span></span></div>
                    <div class="stat"><span class="lbl">Pioggia</span><span class="val" id="sRain">--</span><span class="sub" id="sRainMm">-- mm</span></div>
                    <div class="stat"><span class="lbl">Umidità</span><span class="val" id="sHum">--</span><span class="sub">relativa</span></div>
                    <div class="stat sun"><span class="lbl">Alba</span><span class="val" id="sRise">--:--</span><span class="sub">↑ sorge</span></div>
                    <div class="stat sun"><span class="lbl">Tramonto</span><span class="val" id="sSet">--:--</span><span class="sub">↓ cala</span></div>
                </div>
            </section>

            <aside class="right">
                <h2>Prossimi 5 giorni</h2>
                <ul id="days" class="days"></ul>
                <p class="credit">Dati: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
            </aside>
        </main>
    </div>

    <script src="js/scene.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
